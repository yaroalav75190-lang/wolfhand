# nginx-конфиг для «Рука волка».
# Кладётся в /etc/nginx/sites-available/wolfhand (install.sh делает это автоматически).
# Перед использованием замените WOLF_DOMAIN на реальный домен.

# /etc/nginx/conf.d/wolfhand-ratelimit.conf:
#   limit_req_zone $binary_remote_addr zone=api_rl:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name WOLF_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name WOLF_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/WOLF_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/WOLF_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera=(self): разрешаем камеру только для своих страниц (сканер кода в /admin/redeem.html).
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Логи отдельно для пилотного мониторинга
    access_log /var/log/nginx/wolfhand-access.log;
    error_log  /var/log/nginx/wolfhand-error.log warn;

    # Админ-зона (/admin/*) — защита на уровне приложения через cookie с HMAC-подписью.
    # Лэндинг входа: GET /admin/ → admin/index.html → выбор роли (staff/manager/marketing/partner).
    # Логин через POST /api/admin/login, сессия в httpOnly cookie `wolf_admin` (12 часов).
    # nginx ничего дополнительно не проверяет — но настроены строгие security-заголовки.
    location /admin/ {
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # HTML + статика (публичная зона для гостей)
    location / {
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # API
    location /api/ {
        add_header Cache-Control "no-store" always;
        limit_req zone=api_rl burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
